<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR — AR Algorithm Lab</title><style>body{font-family:system-ui;background:#091222;color:white;max-width:600px;margin:40px auto;padding:20px}input{box-sizing:border-box;width:100%;padding:15px;border-radius:10px;border:1px solid #9ac1d8}button{padding:12px 18px;margin:12px 0;background:#64e5d9;border:0;border-radius:10px;font-weight:bold;cursor:pointer}#qrcode{background:white;display:inline-block;padding:18px;border-radius:12px;margin:12px 0}a{color:#64e5d9}p{line-height:1.5}@media print{input,button,p{display:none}}</style></head><body><h1>QR-код для AR Algorithm Lab</h1><p>После публикации проекта вставьте адрес index.html (например https://username.github.io/ar-algorithm-lab/). Это позволит сделать QR-код, который действительно открывает опубликованный проект.</p><input id="url" type="url" placeholder="https://username.github.io/ar-algorithm-lab/"><br><button id="make">Создать QR-код</button><div><div id="qrcode"></div></div><button onclick="window.print()">Печать QR-кода</button><p><a href="index.html">Назад к проекту</a></p><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>const input=document.getElementById('url');if(location.protocol==='https:')input.value=new URL('index.html',location.href).href;document.getElementById('make').onclick=()=>{const u=input.value.trim();if(!/^https:\/\//i.test(u)){alert('Укажите опубликованный HTTPS-адрес сайта');return;}if(!window.QRCode){alert('Не удалось загрузить библиотеку QR. Проверьте интернет.');return;}document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:u,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});};if(input.value)document.getElementById('make').click();</script></body></html>
